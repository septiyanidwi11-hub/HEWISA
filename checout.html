<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEWISA | Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
            font-family:Arial, Helvetica, sans-serif;
        }

        .navbar{
            background:#1e3a8a;
        }

        .navbar-brand,
        .nav-link{
            color:white !important;
        }

        .checkout-box{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        footer{
            margin-top:60px;
            background:#1e3a8a;
            color:white;
            padding:20px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">🛍️ HEWISA</a>

        <div class="ms-auto">
            <a class="nav-link d-inline" href="index.html">Home</a>
            <a class="nav-link d-inline" href="produk.html">Produk</a>
            <a class="nav-link d-inline" href="keranjang.html">Keranjang</a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="checkout-box">

        <h2 class="text-center text-primary mb-4">
            Checkout
        </h2>

        <form>

            <div class="mb-3">
                <label>Nama Lengkap</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label>Alamat</label>
                <textarea class="form-control"></textarea>
            </div>

            <div class="mb-3">
                <label>No. HP</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label>Metode Pembayaran</label>
                <select class="form-select">
                    <option>Transfer Bank</option>
                    <option>COD</option>
                    <option>E-Wallet</option>
                </select>
            </div>

            <a href="pesanan.html" class="btn btn-primary w-100">
    Pesan Sekarang
</a>
        </form>

    </div>

</div>

<footer class="text-center">
    © 2026 HEWISA
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
