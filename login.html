<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEWISA | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
            font-family:Arial, Helvetica, sans-serif;
        }

        .navbar{
            background:#1e3a8a;
        }

        .navbar-brand,
        .nav-link{
            color:white !important;
        }

        .login-box{
            max-width:450px;
            margin:80px auto;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        .btn-primary{
            background:#1e3a8a;
            border:none;
        }

        .btn-primary:hover{
            background:#162d6b;
        }

        footer{
            margin-top:60px;
            background:#1e3a8a;
            color:white;
            padding:20px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            🛍️ HEWISA
        </a>

        <div class="ms-auto">
            <a class="nav-link d-inline" href="index.html">Home</a>
            <a class="nav-link d-inline" href="produk.html">Produk</a>
            <a class="nav-link d-inline" href="profil.html">Profil</a>
        </div>

    </div>
</nav>

<div class="container">

    <div class="login-box">

        <h2 class="text-center text-primary mb-4">
            Login HEWISA
        </h2>

    <form action="index.html" method="get">

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="Masukkan email">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="Masukkan password">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Login
            </button>

        <form action="index.html" method="get">
